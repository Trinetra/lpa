[build]
  base = "frontend"
  publish = "build"
  command = "yarn install --frozen-lockfile && yarn build"

[build.environment]
  # CI=false so warnings don't fail the CRA build.
  CI = "false"
  NODE_VERSION = "20"

# Old Netlify subdomain -> the real custom domain, so links already sent in
# invoices/tour shares before the migration keep working instead of just
# quietly continuing to serve the app from the old URL forever.
[[redirects]]
  from = "https://lpfees.netlify.app/*"
  to = "https://app.pravaahacfm.com/:splat"
  status = 301
  force = true

# The bare domain's homepage goes to her public website (served from
# /opt/lakshmi/website on the backend server). Only the exact "/" path —
# every other path on pravaahacfm.com is a tour/event custom link
# (pravaahacfm.com/tour2026) and must keep falling through to the app.
[[redirects]]
  from = "https://pravaahacfm.com/"
  to = "https://www.pravaahacfm.com/"
  status = 301
  force = true

# The student portal's manifest link (see index.html) is relative, so it
# resolves to /portal/manifest.json on any /portal/* page — rewrite that to
# the actual student manifest file. Must come before the SPA catch-all below.
[[redirects]]
  from = "/portal/manifest.json"
  to = "/manifest-student.json"
  status = 200

# Client-side routing — every unknown path serves index.html so React Router
# handles it (login, reset-password, invoice/<token>, etc.).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Keep the whole Netlify site out of search results: the app login, plus the
# tour/event custom links on the bare domain (shared directly, not searched
# for). Her public website on www is served from the VPS and stays indexable.
# A header, not robots.txt, so Google can still crawl and see the noindex.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Long-cache the hashed CRA static assets. index.html stays short-cache.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
